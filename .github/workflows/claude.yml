# @claude responder — mention @claude in an issue or PR comment and the
# action spins up Claude Code with this repo checked out (CLAUDE.md is its
# briefing).
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN repo secret (from `claude setup-token`).
#
# This repo is PUBLIC — the author_association guard below means only org
# members, repo collaborators, and owners can summon @claude. Random
# commenters get no run (and no reaction from the workflow).
#
# Note: no npm ci pre-bake here (unlike construct-nuxt) — installs need
# GSAP_TOKEN for the private GreenSock registry, which is only set in
# Netlify. If @claude ever needs to run builds in CI, add GSAP_TOKEN as a
# repo secret and restore the setup-node/npm ci steps.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only fire when @claude is addressed BY someone with standing on the
    # repo (org member / collaborator / owner) — this repo is public, so
    # without the author_association check anyone on the internet could
    # burn the token by commenting @claude.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    # write perms let @claude push branches and open PRs — it still cannot
    # merge; a human holds the merge button
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets @claude read CI results when investigating failures
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The app install grants workflows:write, but the per-run token
          # only requests it when listed here — without it, pushing any NEW
          # branch fails (GitHub counts the repo's existing workflow files
          # as "created" on a new ref).
          additional_permissions: |
            workflows: write
